name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Unpack project
        shell: pwsh
        run: Get-ChildItem *.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath . -Force }
      - name: Send releases to the public repo
        shell: bash
        run: |
          node -e "const f=require('fs'),p=JSON.parse(f.readFileSync('package.json'));p.build.publish=[{provider:'github',owner:'nilesiavon',repo:'SpinWheel-Releases',releaseType:'release'}];f.writeFileSync('package.json',JSON.stringify(p,null,2))"
      - run: npm install
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
